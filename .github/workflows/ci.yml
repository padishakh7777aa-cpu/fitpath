name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright @twa-dev/sdk axe-core
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: nohup python3 -m http.server 8123 >/dev/null 2>&1 &
      - run: sleep 2 && node tests/qa-screens.js
      - run: node tests/qa-workouts.js
      - run: timeout 240 node tests/qa-telegram.js
      - run: timeout 240 node tests/qa-a11y.js
  bot-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: bot-worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
  bot-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: bot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q test_bot.py
